<head>

<title>Atlas</title>
<style>html,body{touch-action:none;background:#e9dff7;height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}#game{position:fixed;inset:0}#dbgBtn{z-index:10;color:#fff;background:#0006;border:0;border-radius:20px;width:40px;height:40px;font-size:20px;position:fixed;bottom:8px;right:8px}#dbg{z-index:10;background:#fffffff2;border-radius:12px;width:220px;padding:12px;font-size:14px;display:none;position:fixed;bottom:56px;right:8px;box-shadow:0 4px 20px #0004}#dbg.open{display:block}#dbg label{margin:6px 0;display:block}#dbg button{background:#efe;border:1px solid #7a5;border-radius:8px;margin:3px 2px;padding:6px 8px}#dbg input,#dbg select{width:90px}</style>
  <script type="module" crossorigin src="./assets/index-BreeTCr9.js"></script>
</head>
<body>
<div id="game"></div>
<button id="dbgBtn" aria-label="debug">⚙</button>
<div id="dbg">
  <b>Debug</b>
  <label>Level <select id="dbgLevel"></select> <button id="dbgGo">Go</button></label>
  <label>Seed <input id="dbgSeed" placeholder="default" inputmode="numeric" /> <button id="dbgSeedSet">Set</button></label>
  <div><button id="dbgAuto">Auto-play move</button><button id="dbgWin">Auto-finish</button></div>
  <div><button id="dbgMap">Map</button><button id="dbgReset">Reset progress</button></div>

</div>
